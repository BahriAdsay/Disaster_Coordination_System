<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNo2 - Aid Request</title>
    <link rel="stylesheet" href="victim.css">
</head>
<body>

<div class="navbar">
    <h1>PNo2 - Disaster Coordination</h1>
    <span id="welcomeMsg"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<div class="layout">

    <!-- Sol: Yardim Talebi Formu -->
    <div class="form-panel">
        <h2>Submit Aid Request</h2>

        <form id="requestForm">
            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select...</option>
                <option value="food">Food</option>
                <option value="water">Water</option>
                <option value="medicine">Medicine</option>
                <option value="shelter">Shelter</option>
            </select>

            <label for="urgency">Urgency</label>
            <select id="urgency" required>
                <option value="">Select...</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" value="1" required>

            <label>Location</label>
            <div id="locationBox" style="border:1px solid #ccc; border-radius:5px; padding:10px; background:#f9f9f9; font-size:13px; color:#555;">
                Location not detected yet.
                <button type="button" id="getLocationBtn" onclick="getLocation()" style="margin-left:10px; padding:4px 12px; background:#2c6fad; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px;">Get My Location</button>
            </div>
            <input type="hidden" id="zone">
            <input type="hidden" id="lat">
            <input type="hidden" id="lng">

            <label for="description">Description</label>
            <textarea id="description" placeholder="Briefly describe your need..."></textarea>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Request</button>
        </form>

        <p id="formMsg"></p>
    </div>

    <!-- Sag: Taleplerim -->
    <div class="requests-panel">
        <h2>
            My Requests
            <button class="btn-refresh" onclick="loadMyRequests()">Refresh</button>
        </h2>
        <div class="request-list" id="requestList">
            <p class="loading">Loading...</p>
        </div>
    </div>

</div>

<script src="victim.js"></script>

</body>
</html>
